name: Claude Session API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run Claude API
        run: |
          cat > api.py << 'PYEOF'
          import socket, struct, threading, time, json, urllib.request, urllib.error, uuid
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import os

          KEY = os.environ["CLAUDE_KEY"]
          ORG = "15b4f0c6-9543-4aef-bf9b-b655a6a18c05"

          def call(prompt):
              cid = str(uuid.uuid4())
              h = {"Cookie": f"sessionKey={KEY}", "Content-Type": "application/json", "User-Agent": "Mozilla/5.0 (Macintosh)"}
              r = urllib.request.Request(f"https://claude.ai/api/organizations/{ORG}/chat_conversations",
                  data=json.dumps({"uuid": cid, "name": "gh"}).encode(), headers=h, method="POST")
              with urllib.request.urlopen(r, 15) as resp: conv = json.loads(resp.read())
              r2 = urllib.request.Request(f"https://claude.ai/api/organizations/{ORG}/chat_conversations/{conv['uuid']}/completion",
                  data=json.dumps({"prompt": prompt, "timezone": "Asia/Shanghai", "attachments": [], "files": []}).encode(), headers=h, method="POST")
              text = ""
              with urllib.request.urlopen(r2, 120) as resp:
                  for line in resp:
                      line = line.decode().strip()
                      if line.startswith("data: "):
                          try:
                              d = json.loads(line[6:])
                              if d.get("completion"): text = d["completion"]
                          except: pass
              return text

          class H(BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_GET(self):
                  if self.path == "/health": self._j({"status":"ok"})
                  elif self.path == "/v1/models": self._j({"object":"list","data":[{"id":"claude-session","object":"model","created":int(time.time())}]})
              def do_POST(self):
                  if self.path == "/v1/chat/completions":
                      try:
                          body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                          msg = body["messages"][-1]["content"]
                          result = call(msg)
                          self._j({"id":f"chatcmpl-{uuid.uuid4().hex[:12]}","object":"chat.completion","created":int(time.time()),"model":"claude-session","choices":[{"index":0,"message":{"role":"assistant","content":result},"finish_reason":"stop"}]})
                      except Exception as e: self._j({"error":str(e)},500)
              def _j(self,d,code=200):
                  self.send_response(code);self.send_header("Content-Type","application/json");self.end_headers()
                  try:self.wfile.write(json.dumps(d).encode())
                  except:pass

          # Start API
          threading.Thread(target=lambda:HTTPServer(("0.0.0.0",8765),H).serve_forever(),daemon=True).start()
          time.sleep(2)
          
          # Start tunnel
          try:
              s=socket.socket();s.settimeout(10);s.connect(("bore.pub",7835))
              s.send(struct.pack(">H",8765))
              port=struct.unpack(">H",s.recv(2))[0]
              print(f"✅ API: http://bore.pub:{port}/v1/chat/completions")
          except:
              print("⚠️ 隧道失败，但API在8765运行")
          
          while True: time.sleep(60)
          PYEOF
          python3 api.py
        env:
          CLAUDE_KEY: ${{ secrets.CLAUDE_SESSION_KEY }}
